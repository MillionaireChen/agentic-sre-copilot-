name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sre
          POSTGRES_PASSWORD: sre
          POSTGRES_DB: sre
        ports: ["15432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          pip install fastapi 'uvicorn[standard]' sqlalchemy 'psycopg[binary]' \
            pgvector pydantic-settings prometheus-client pyyaml httpx \
            langgraph langchain langchain-openai openai \
            langgraph-checkpoint-postgres sse-starlette pytest ruff
      - name: Lint
        run: ruff check backend services eval
      - name: Unit tests (mock LLM, no observability stack)
        env:
          DATABASE_URL: postgresql+psycopg://sre:sre@localhost:15432/sre
        run: pytest tests/test_agent_graph.py -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
